name: Daily Swing Pipeline

on:
  schedule:
    # 10:35 UTC = 16:05 IST -- ~35 min after NSE close (15:30 IST), so EOD
    # data has time to post. Adjust if your data source publishes later.
    - cron: "35 10 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Projects/20_Graph_Swing_Setup/pipeline/requirements.txt

      - name: Fetch live market data (EOD, bulk deals, FII/DII, F&O OI)
        run: python Projects/20_Graph_Swing_Setup/pipeline/fetch_all_market_data.py

      - name: Run pipeline
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python Projects/20_Graph_Swing_Setup/pipeline/run_pipeline.py

      - name: Deploy dashboard to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: nifty-graph-swing
          directory: Projects/20_Graph_Swing_Setup/dashboard

      - name: Commit updated market data + dashboard back to the repo
        run: |
          git config user.name "swing-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Projects/20_Graph_Swing_Setup/dashboard/dashboard_data.json Projects/20_Graph_Swing_Setup/data/*.csv
          git diff --staged --quiet || git commit -m "Daily pipeline run: $(date -u +'%Y-%m-%d')"
          git push