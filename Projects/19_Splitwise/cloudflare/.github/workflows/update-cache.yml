name: Update Splitwise Cache

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Splitwise data
        run: node scripts/update-cache.js
        env:
          SPLITWISE_TOKEN: ${{ secrets.SPLITWISE_TOKEN }}
          GROUP_NAME:      'Badminton Expense'
          DAYS_BACK:       '1095'

      - name: Commit updated cache
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/cache.json
          git diff --staged --quiet || git commit -m "chore: update Splitwise cache $(date -u +%Y-%m-%dT%H:%M)"
          git push
