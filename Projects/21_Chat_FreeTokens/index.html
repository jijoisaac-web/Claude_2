<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="version" content="2.3.0" />
  <title>FreeTokens Studio v2.3.0 — Prompt-to-Shorts & Creator AI Suite</title>
  <link rel="preconnect" href="https://googleapis.com" />
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #070A0F;
      --surface:      rgba(14, 19, 28, 0.85);
      --surface-card: rgba(19, 26, 38, 0.7);
      --surface-elev: rgba(26, 36, 52, 0.85);
      --border:       rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --border-focus: rgba(0, 200, 255, 0.5);
      --accent:       #00C8FF;
      --accent-glow:  rgba(0, 200, 255, 0.25);
      --accent-grad:  linear-gradient(135deg, #00C8FF 0%, #0066FF 100%);
      --accent-dim:   rgba(0, 200, 255, 0.1);
      --text:         #F0F4F8;
      --text-dim:     #94A3B8;
      --muted:        #64748B;
      --danger:       #F85149;
      --success:      #10B981;
      --radius-sm:    8px;
      --radius-md:    12px;
      --radius-lg:    16px;
      --mono:         'JetBrains Mono', monospace;
      --sans:         'Inter', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: radial-gradient(circle at 10% 10%, rgba(0, 200, 255, 0.04) 0%, transparent 45%),
                  radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.04) 0%, transparent 45%),
                  var(--bg);
      color: var(--text); font-family: var(--sans); font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    #app { display: flex; height: 100vh; position: relative; }

    /* ── Sidebar ── */
    #sidebar {
      width: 320px; min-width: 320px;
      background: var(--surface);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform .28s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo-row { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
    .logo-badge {
      width: 30px; height: 30px; border-radius: 9px;
      background: var(--accent-grad);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff;
      box-shadow: 0 0 16px rgba(0, 200, 255, 0.4);
    }
    .logo-title {
      font-size: 16px; font-weight: 700; letter-spacing: -.4px;
      background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .ver-badge {
      font-size: 10px; font-family: var(--mono); background: var(--accent-dim);
      color: var(--accent); border: 1px solid rgba(0, 200, 255, 0.3);
      padding: 2px 7px; border-radius: 12px; font-weight: 600;
    }
    .logo-sub { font-size: 11px; color: var(--muted); margin-left: 39px; font-family: var(--mono); }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 16px; }

    .section-title {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; padding: 0 8px; margin-bottom: 6px;
    }

    /* Tool Nav Items */
    .tool-nav { display: flex; flex-direction: column; gap: 3px; }
    .tool-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      background: transparent; border: 1px solid transparent;
      color: var(--text-dim); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all .16s ease; text-align: left; width: 100%;
      position: relative;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
    }
    .tool-btn.active {
      background: linear-gradient(90deg, rgba(0, 200, 255, 0.12) 0%, rgba(0, 200, 255, 0.02) 100%);
      border: 1px solid rgba(0, 200, 255, 0.25);
      border-left: 3px solid var(--accent);
      color: #FFF; font-weight: 600;
    }
    .tool-btn .t-icon { font-size: 16px; width: 22px; text-align: center; }
    .tool-btn .t-name { flex: 1; letter-spacing: -.1px; }
    .tool-btn .t-pill {
      font-size: 9px; font-family: var(--mono); background: rgba(255,255,255,.05);
      padding: 2px 6px; border-radius: 5px; color: var(--muted); border: 1px solid rgba(255,255,255,.05);
    }
    .tool-btn.active .t-pill {
      background: rgba(0, 200, 255, 0.2); color: var(--accent); border-color: rgba(0, 200, 255, 0.3);
    }

    /* Engine Settings Box */
    .settings-box {
      background: rgba(16, 23, 34, 0.6);
      border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .field-group label {
      display: block; font-size: 10.5px; font-weight: 600; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px;
    }
    .field-group select {
      width: 100%; background: rgba(7, 10, 15, 0.85); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); font-family: var(--mono);
      font-size: 12px; padding: 8px 10px; outline: none; transition: all .16s ease;
      cursor: pointer;
    }
    .field-group select:focus {
      border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.12);
    }
    .field-group select option { background: #0E131B; color: var(--text); }

    .stat-bar { display: flex; flex-direction: column; gap: 5px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.05); }
    .stat-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .stat-label { color: var(--muted); }
    .stat-val { font-family: var(--mono); color: var(--accent); font-weight: 600; }

    /* ── Main View Container ── */
    #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: transparent; position: relative; }

    /* Chat Assistant Panel Layout */
    .chat-container { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; }
    .chat-history { flex: 1; overflow-y: auto; padding-right: 8px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
    
    /* Messages styling */
    .message-row { display: flex; width: 100%; gap: 12px; }
    .message-row.user { justify-content: flex-end; }
    .message-bubble { max-width: 80%; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13.5px; line-height: 1.5; }
    .message-row.user .message-bubble { background: var(--accent-grad); color: #fff; border-bottom-right-radius: 4px; }
    .message-row.assistant .message-bubble { background: var(--surface-card); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
    
    /* Universal Dropzone & File Uploader UI Elements */
    .chat-input-wrapper { 
      background: var(--surface-card); 
      border: 1px dashed var(--border); 
      border-radius: var(--radius-lg); 
      padding: 12px; 
      transition: all 0.2s ease-in-out; 
      position: relative;
    }
    .chat-input-wrapper.dragover {
      border-color: var(--accent);
      background: rgba(0, 200, 255, 0.05);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .file-preview-area { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
    .file-preview-area:empty { display: none; }
    
    .file-pill {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-family: var(--mono); font-size: 11px;
    }
    .file-pill .file-icon { color: var(--accent); }
    .file-pill .file-remove { color: var(--danger); cursor: pointer; font-weight: bold; margin-left: 4px; }
    .file-pill .file-status { color: var(--success); font-size: 10px; padding: 1px 5px; background: rgba(16, 185, 129, 0.1); border-radius: 4px; }
    
    .input-row { display: flex; align-items: flex-end; gap: 10px; }
    .chat-textarea { 
      flex: 1; background: transparent; border: none; outline: none; color: var(--text); 
      font-family: var(--sans); font-size: 13.5px; resize: none; min-height: 40px; max-height: 160px; line-height: 1.5;
    }
    .chat-actions { display: flex; align-items: center; gap: 8px; }
    .action-trigger {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); width: 36px; height: 36px;
      border-radius: var(--radius-sm); color: var(--text-dim); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; font-size: 16px;
    }
    .action-trigger:hover { color: #fff; border-color: var(--border-hover); background: rgba(255,255,255,0.08); }
    .action-trigger.submit-btn { background: var(--accent-grad); color: #fff; border: none; }
    .action-trigger.submit-btn:hover { box-shadow: 0 0 12px var(--accent-glow); opacity: 0.95; }
    
    #file-hidden-input { display: none; }
  </style>
</head>
<body>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo-row">
          <div class="logo-badge">⚡</div>
