<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeChat — OpenRouter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D1117;
      --surface:   #161B22;
      --border:    #21262D;
      --accent:    #00C8FF;
      --accent-dim:#004F63;
      --text:      #E6EDF3;
      --muted:     #7D8590;
      --user-bg:   #1C2D3A;
      --ai-bg:     #161B22;
      --danger:    #F85149;
      --success:   #3FB950;
      --radius:    10px;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px; min-width: 280px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      transition: transform .25s ease;
    }

    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
    .logo-dot {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #0077AA);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-name { font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
    .logo-sub  { font-size: 11px; color: var(--muted); margin-left: 38px; font-family: var(--mono); }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 18px; }

    /* API Key */
    .field-group label {
      display: block; font-size: 11px; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px;
    }
    .field-group input, .field-group select, .field-group textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-family: var(--mono);
      font-size: 12px; padding: 8px 10px; outline: none;
      transition: border-color .15s;
    }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus {
      border-color: var(--accent);
    }
    .field-group input[type="password"] { letter-spacing: 2px; }
    .field-group select { cursor: pointer; }
    .field-group select option { background: var(--surface); }
    .field-group textarea { resize: vertical; min-height: 90px; font-family: var(--sans); font-size: 13px; line-height: 1.5; letter-spacing: 0; }

    .key-row { display: flex; gap: 6px; }
    .key-row input { flex: 1; }
    .icon-btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); cursor: pointer; padding: 0 10px; font-size: 13px;
      transition: color .15s, border-color .15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }

    .status-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--muted); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .status-dot.ok  { background: var(--success); }
    .status-dot.err { background: var(--danger); }

    /* Model selector */
    .model-meta { font-size: 11px; color: var(--muted); margin-top: 5px; font-family: var(--mono); }
    .model-meta span { color: var(--success); }

    /* Params */
    .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .param-grid .field-group { margin: 0; }

    /* Stats */
    .stat-bar { display: flex; flex-direction: column; gap: 4px; }
    .stat-item { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .stat-label { color: var(--muted); }
    .stat-val { font-family: var(--mono); color: var(--accent); }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 12px; border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .btn {
      flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border); transition: all .15s;
    }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: rgba(248,81,73,.1); }

    /* ── Chat area ── */
    #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Topbar */
    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--surface); min-height: 54px;
    }
    #topbar .model-label { font-size: 13px; font-weight: 500; color: var(--text); }
    #topbar .ctx-badge {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border);
      padding: 3px 8px; border-radius: 20px;
    }
    #menu-toggle {
      display: none; background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 18px; padding: 4px;
    }

    /* Messages */
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 2px; }

    .msg-wrap { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--radius); }
    .msg-wrap.user { background: var(--user-bg); flex-direction: row-reverse; }
    .msg-wrap.assistant { background: var(--ai-bg); }
    .msg-wrap:hover .msg-actions { opacity: 1; }

    .avatar {
      width: 30px; height: 30px; min-width: 30px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .avatar.user { background: var(--accent-dim); color: var(--accent); }
    .avatar.ai   { background: #1E2D1A; color: var(--success); }

    .msg-content { flex: 1; min-width: 0; }
    .msg-role { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .msg-text { line-height: 1.65; font-size: 14px; word-break: break-word; }
    .msg-text p { margin-bottom: .6em; }
    .msg-text p:last-child { margin-bottom: 0; }
    .msg-text pre { background: #0D1117; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
    .msg-text code { font-family: var(--mono); font-size: 12.5px; }
    .msg-text p > code { background: rgba(255,255,255,.07); padding: 2px 5px; border-radius: 4px; }
    .msg-text ul, .msg-text ol { padding-left: 20px; margin: .4em 0; }
    .msg-text li { margin: .2em 0; }
    .msg-text h1,.msg-text h2,.msg-text h3 { margin: .8em 0 .3em; font-weight: 600; }
    .msg-text blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 6px 0; }
    .msg-text table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    .msg-text th, .msg-text td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .msg-text th { background: var(--bg); font-weight: 600; }

    .msg-actions { opacity: 0; transition: opacity .15s; margin-top: 6px; display: flex; gap: 6px; }
    .msg-action-btn {
      font-size: 11px; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 8px; cursor: pointer; transition: color .15s;
    }
    .msg-action-btn:hover { color: var(--text); }

    /* Thinking indicator */
    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Empty state */
    #empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 40px; text-align: center;
    }
    #empty-state .empty-icon { font-size: 42px; }
    #empty-state h2 { font-size: 20px; font-weight: 600; }
    #empty-state p { color: var(--muted); max-width: 360px; line-height: 1.6; }
    .quick-prompts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .quick-btn {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 7px 14px; font-size: 13px;
      cursor: pointer; color: var(--text); transition: border-color .15s, background .15s;
    }
    .quick-btn:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* Input area */
    #input-area {
      padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface);
    }
    #input-form { display: flex; gap: 10px; align-items: flex-end; }
    #user-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-family: var(--sans);
      font-size: 14px; padding: 10px 14px; outline: none; resize: none;
      max-height: 180px; line-height: 1.5; transition: border-color .15s;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 40px; height: 40px; background: var(--accent); border: none;
      border-radius: 10px; cursor: pointer; color: #000;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: filter .15s, transform .1s;
    }
    #send-btn:hover { filter: brightness(1.1); }
    #send-btn:active { transform: scale(.94); }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }

    .input-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .input-meta-left { font-size: 11px; color: var(--muted); }
    .input-meta-right { font-size: 11px; color: var(--muted); font-family: var(--mono); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Mobile */
    @media (max-width: 700px) {
      #sidebar {
        position: fixed; top: 0; left: 0; height: 100vh; z-index: 100;
        transform: translateX(-100%);
      }
      #sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.5); }
      #menu-toggle { display: block; }
      #overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
        z-index: 99;
      }
      #overlay.visible { display: block; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-dot">⚡</div>
        <span class="logo-name">FreeChat</span>
      </div>
      <div class="logo-sub">OpenRouter · Free Models</div>
    </div>

    <div class="sidebar-body">

      <!-- API Key -->
      <div class="field-group">
        <label>OpenRouter API Key</label>
        <div class="key-row">
          <input type="password" id="api-key" placeholder="sk-or-v1-…" autocomplete="off" />
          <button class="icon-btn" id="key-toggle" title="Show/hide">👁</button>
          <button class="icon-btn" id="key-save" title="Save">✓</button>
        </div>
        <div class="status-row">
          <div class="status-dot" id="key-dot"></div>
          <span id="key-status">Enter your API key to begin</span>
        </div>
      </div>

      <!-- Model -->
      <div class="field-group">
        <label>Model</label>
        <select id="model-select">
          <option value="">— save key to load models —</option>
        </select>
        <div class="model-meta" id="model-meta">Select a model above</div>
      </div>

      <!-- System Prompt -->
      <div class="field-group">
        <label>System Prompt</label>
        <textarea id="system-prompt" placeholder="You are a helpful assistant…">You are a helpful, concise, and knowledgeable assistant. Respond clearly and thoughtfully.</textarea>
      </div>

      <!-- Params -->
      <div>
        <div class="field-group" style="margin-bottom:8px">
          <label>Parameters</label>
        </div>
        <div class="param-grid">
          <div class="field-group">
            <label>Temperature</label>
            <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1" />
          </div>
          <div class="field-group">
            <label>Max Tokens</label>
            <input type="number" id="max-tokens" value="2048" min="256" max="8192" step="256" />
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div>
        <div class="field-group" style="margin-bottom:8px">
          <label>Session Stats</label>
        </div>
        <div class="stat-bar">
          <div class="stat-item"><span class="stat-label">Messages</span><span class="stat-val" id="stat-msgs">0</span></div>
          <div class="stat-item"><span class="stat-label">Est. tokens</span><span class="stat-val" id="stat-tokens">0</span></div>
          <div class="stat-item"><span class="stat-label">Cost</span><span class="stat-val" id="stat-cost">$0.0000</span></div>
        </div>
      </div>

    </div>

    <div class="sidebar-footer">
      <button class="btn btn-danger" id="clear-btn">Clear chat</button>
      <button class="btn btn-ghost" id="export-btn">Export</button>
    </div>
  </aside>

  <div id="overlay"></div>

  <!-- ── Chat ── -->
  <main id="chat-area">
    <div id="topbar">
      <button id="menu-toggle">☰</button>
      <span class="model-label" id="topbar-model">No model selected</span>
      <span class="ctx-badge" id="topbar-ctx">0 msgs</span>
    </div>

    <div id="messages">
      <div id="empty-state">
        <div class="empty-icon">⚡</div>
        <h2>FreeChat</h2>
        <p>Access powerful AI models completely free via OpenRouter. Add your API key and pick a model to start building.</p>
        <div class="quick-prompts">
          <button class="quick-btn" onclick="setPrompt('Explain quantum computing in simple terms')">Explain quantum computing</button>
          <button class="quick-btn" onclick="setPrompt('Write a Python web scraper for any website')">Write a web scraper</button>
          <button class="quick-btn" onclick="setPrompt('Help me design a REST API for a todo app')">Design a REST API</button>
          <button class="quick-btn" onclick="setPrompt('What are the best free AI models available today?')">Best free AI models</button>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-form">
        <textarea id="user-input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for new line)"></textarea>
        <button id="send-btn" title="Send">▶</button>
      </div>
      <div class="input-meta">
        <span class="input-meta-left">Powered by <a href="https://openrouter.ai" target="_blank" style="color:var(--accent);text-decoration:none">OpenRouter</a></span>
        <span class="input-meta-right" id="char-count">0 chars</span>
      </div>
    </div>
  </main>
</div>

<script>
// ── Free models list (fallback if API fetch fails) ──
const KNOWN_FREE = [
  { id: 'meta-llama/llama-3.3-70b-instruct:free',      name: 'Llama 3.3 70B Instruct',      ctx: 131072 },
  { id: 'meta-llama/llama-3.1-8b-instruct:free',       name: 'Llama 3.1 8B Instruct',       ctx: 131072 },
  { id: 'meta-llama/llama-3.2-3b-instruct:free',       name: 'Llama 3.2 3B Instruct',       ctx: 131072 },
  { id: 'meta-llama/llama-3.2-1b-instruct:free',       name: 'Llama 3.2 1B Instruct',       ctx: 131072 },
  { id: 'google/gemma-2-9b-it:free',                   name: 'Gemma 2 9B IT',               ctx: 8192   },
  { id: 'google/gemma-3-27b-it:free',                  name: 'Gemma 3 27B IT',              ctx: 131072 },
  { id: 'google/gemma-3-12b-it:free',                  name: 'Gemma 3 12B IT',              ctx: 131072 },
  { id: 'mistralai/mistral-7b-instruct:free',          name: 'Mistral 7B Instruct',         ctx: 32768  },
  { id: 'mistralai/devstral-small:free',               name: 'Devstral Small (Code)',        ctx: 131072 },
  { id: 'qwen/qwen-2.5-72b-instruct:free',             name: 'Qwen 2.5 72B Instruct',       ctx: 131072 },
  { id: 'qwen/qwen-2.5-7b-instruct:free',              name: 'Qwen 2.5 7B Instruct',        ctx: 131072 },
  { id: 'qwen/qwq-32b:free',                           name: 'QwQ 32B (Reasoning)',          ctx: 131072 },
  { id: 'deepseek/deepseek-r1:free',                   name: 'DeepSeek R1 (Reasoning)',      ctx: 163840 },
  { id: 'deepseek/deepseek-r1-distill-llama-70b:free', name: 'DeepSeek R1 Distill 70B',     ctx: 131072 },
  { id: 'deepseek/deepseek-chat-v3-0324:free',         name: 'DeepSeek V3 Chat',            ctx: 163840 },
  { id: 'microsoft/phi-4-reasoning:free',              name: 'Phi-4 Reasoning',             ctx: 32768  },
  { id: 'microsoft/phi-4-reasoning-plus:free',         name: 'Phi-4 Reasoning Plus',        ctx: 32768  },
  { id: 'nvidia/llama-3.1-nemotron-70b-instruct:free', name: 'Nemotron 70B Instruct',       ctx: 131072 },
  { id: 'openchat/openchat-7b:free',                   name: 'OpenChat 7B',                 ctx: 8192   },
  { id: 'nousresearch/hermes-3-llama-3.1-405b:free',  name: 'Hermes 3 Llama 3.1 405B',    ctx: 131072 },
  { id: 'liquid/lfm-40b:free',                         name: 'LFM 40B',                     ctx: 32768  },
  { id: 'moonshotai/moonlight-16a-8b-instruct:free',  name: 'Moonlight 16A 8B',            ctx: 131072 },
];

// ── State ──
let messages    = [];
let isStreaming  = false;
let totalTokens  = 0;

const $ = id => document.getElementById(id);

// ── Persist API key ──
const savedKey = localStorage.getItem('or_api_key') || '';
$('api-key').value = savedKey;
if (savedKey) validateKey(savedKey);

// ── Key controls ──
$('key-toggle').addEventListener('click', () => {
  const inp = $('api-key');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

$('key-save').addEventListener('click', () => {
  const key = $('api-key').value.trim();
  if (!key) return;
  localStorage.setItem('or_api_key', key);
  validateKey(key);
});

$('api-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('key-save').click(); }
});

async function validateKey(key) {
  setKeyStatus('loading', 'Checking key…');
  try {
    const res = await fetch('https://openrouter.ai/api/v1/models', {
      headers: { Authorization: `Bearer ${key}` }
    });
    if (!res.ok) throw new Error('Invalid');
    const data = await res.json();
    const free = data.data.filter(m => m.id.endsWith(':free')).sort((a,b) => a.name.localeCompare(b.name));
    populateModels(free.length ? free : null);
    setKeyStatus('ok', `Key valid · ${free.length || KNOWN_FREE.length} free models`);
  } catch {
    populateModels(null);
    setKeyStatus('err', 'Invalid key — check and retry');
  }
}

function setKeyStatus(state, text) {
  const dot = $('key-dot'), status = $('key-status');
  dot.className = 'status-dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  status.textContent = text;
}

function populateModels(models) {
  const sel = $('model-select');
  const list = models || KNOWN_FREE;
  sel.innerHTML = '';
  list.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.name || m.id;
    sel.appendChild(opt);
  });
  updateModelMeta();
}

$('model-select').addEventListener('change', updateModelMeta);

function updateModelMeta() {
  const id = $('model-select').value;
  const meta = $('model-meta');
  const all = [...(KNOWN_FREE)];
  const found = all.find(m => m.id === id);
  if (found) {
    const ctx = found.ctx ? `${(found.ctx/1000).toFixed(0)}k ctx` : '';
    meta.innerHTML = `<span>FREE</span>${ctx ? ' · ' + ctx : ''} · ${id.split('/')[0]}`;
  } else if (id) {
    meta.innerHTML = `<span>FREE</span> · ${id.split('/')[0]}`;
  } else {
    meta.textContent = 'Select a model above';
  }
  $('topbar-model').textContent = $('model-select').options[$('model-select').selectedIndex]?.text || 'No model selected';
}

// ── Auto-resize textarea ──
const userInput = $('user-input');
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
  $('char-count').textContent = userInput.value.length + ' chars';
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

$('send-btn').addEventListener('click', send);

// ── Quick prompts ──
function setPrompt(text) {
  userInput.value = text;
  userInput.dispatchEvent(new Event('input'));
  userInput.focus();
}
window.setPrompt = setPrompt;

// ── Send message ──
async function send() {
  if (isStreaming) return;
  const key   = localStorage.getItem('or_api_key');
  const model = $('model-select').value;
  const text  = userInput.value.trim();
  if (!key)   return alert('Please enter and save your OpenRouter API key.');
  if (!model) return alert('Please select a model.');
  if (!text)  return;

  hideEmpty();
  isStreaming = true;
  $('send-btn').disabled = true;

  // Add user message
  messages.push({ role: 'user', content: text });
  appendMessage('user', text);
  userInput.value = '';
  userInput.style.height = 'auto';
  $('char-count').textContent = '0 chars';
  updateStats();

  // Add assistant placeholder
  const aiWrap = appendMessage('assistant', '');
  const aiText = aiWrap.querySelector('.msg-text');
  aiText.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  const sysPrompt = $('system-prompt').value.trim();
  const temperature = parseFloat($('temperature').value) || 0.7;
  const max_tokens  = parseInt($('max-tokens').value)   || 2048;

  const body = {
    model,
    max_tokens,
    temperature,
    stream: true,
    messages: [
      ...(sysPrompt ? [{ role: 'system', content: sysPrompt }] : []),
      ...messages
    ]
  };

  let fullReply = '';
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${key}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': location.origin,
        'X-Title': 'FreeChat'
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    aiText.innerHTML = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const json = line.slice(6).trim();
        if (json === '[DONE]') break;
        try {
          const parsed = JSON.parse(json);
          const delta  = parsed.choices?.[0]?.delta?.content || '';
          fullReply   += delta;
          aiText.innerHTML = DOMPurify.sanitize(marked.parse(fullReply));
          const msgs = $('messages');
          msgs.scrollTop = msgs.scrollHeight;
          // collect usage if provided
          if (parsed.usage) totalTokens += (parsed.usage.total_tokens || 0);
        } catch { /* skip malformed chunks */ }
      }
    }

    messages.push({ role: 'assistant', content: fullReply });
    totalTokens += Math.ceil((text.length + fullReply.length) / 4);
    updateStats();

  } catch (err) {
    aiText.innerHTML = `<span style="color:var(--danger)">Error: ${err.message}</span>`;
  } finally {
    isStreaming = false;
    $('send-btn').disabled = false;
    userInput.focus();
  }
}

// ── Render a message bubble ──
function appendMessage(role, content) {
  const empty = $('empty-state');
  if (empty) empty.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${role}`;

  const av = document.createElement('div');
  av.className = `avatar ${role === 'user' ? 'user' : 'ai'}`;
  av.textContent = role === 'user' ? 'U' : 'AI';

  const body = document.createElement('div');
  body.className = 'msg-content';

  const roleLabel = document.createElement('div');
  roleLabel.className = 'msg-role';
  roleLabel.textContent = role === 'user' ? 'You' : ($('model-select').options[$('model-select').selectedIndex]?.text || 'Assistant');

  const text = document.createElement('div');
  text.className = 'msg-text';
  if (content) text.innerHTML = DOMPurify.sanitize(marked.parse(content));

  const actions = document.createElement('div');
  actions.className = 'msg-actions';

  const copyBtn = document.createElement('button');
  copyBtn.className = 'msg-action-btn';
  copyBtn.textContent = 'Copy';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(content || text.innerText);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = 'Copy', 1500);
  };

  if (role === 'assistant') {
    const regen = document.createElement('button');
    regen.className = 'msg-action-btn';
    regen.textContent = 'Regenerate';
    regen.onclick = () => regenerate(wrap);
    actions.appendChild(regen);
  }
  actions.appendChild(copyBtn);

  body.appendChild(roleLabel);
  body.appendChild(text);
  body.appendChild(actions);
  wrap.appendChild(av);
  wrap.appendChild(body);

  $('messages').appendChild(wrap);
  $('messages').scrollTop = $('messages').scrollHeight;
  $('topbar-ctx').textContent = `${messages.length} msgs`;
  return wrap;
}

// ── Regenerate ──
async function regenerate(wrap) {
  if (isStreaming) return;
  // Remove last assistant message from state and DOM
  if (messages[messages.length - 1]?.role === 'assistant') messages.pop();
  wrap.remove();
  userInput.value = messages[messages.length - 1]?.content || '';
  if (messages[messages.length - 1]?.role === 'user') messages.pop();
  await send();
}

// ── Stats ──
function updateStats() {
  $('stat-msgs').textContent  = messages.length;
  $('stat-tokens').textContent = totalTokens.toLocaleString();
  $('stat-cost').textContent  = '$0.0000';
  $('topbar-ctx').textContent = `${messages.length} msgs`;
}

// ── Clear ──
$('clear-btn').addEventListener('click', () => {
  if (!confirm('Clear all messages?')) return;
  messages = [];
  totalTokens = 0;
  const msgs = $('messages');
  msgs.innerHTML = '';
  const empty = document.createElement('div');
  empty.id = 'empty-state';
  empty.innerHTML = `
    <div class="empty-icon">⚡</div>
    <h2>FreeChat</h2>
    <p>Access powerful AI models completely free via OpenRouter. Add your API key and pick a model to start building.</p>
    <div class="quick-prompts">
      <button class="quick-btn" onclick="setPrompt('Explain quantum computing in simple terms')">Explain quantum computing</button>
      <button class="quick-btn" onclick="setPrompt('Write a Python web scraper for any website')">Write a web scraper</button>
      <button class="quick-btn" onclick="setPrompt('Help me design a REST API for a todo app')">Design a REST API</button>
      <button class="quick-btn" onclick="setPrompt('What are the best free AI models available today?')">Best free AI models</button>
    </div>`;
  msgs.appendChild(empty);
  updateStats();
});

// ── Export ──
$('export-btn').addEventListener('click', () => {
  const lines = messages.map(m => `### ${m.role.toUpperCase()}\n${m.content}`).join('\n\n---\n\n');
  const blob  = new Blob([lines], { type: 'text/markdown' });
  const a     = document.createElement('a');
  a.href      = URL.createObjectURL(blob);
  a.download  = `chat-${Date.now()}.md`;
  a.click();
});

// ── Mobile sidebar ──
$('menu-toggle').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('visible');
});
$('overlay').addEventListener('click', () => {
  $('sidebar').classList.remove('open');
  $('overlay').classList.remove('visible');
});

function hideEmpty() {
  const e = $('empty-state');
  if (e) e.style.display = 'none';
}
</script>
</body>
</html>
